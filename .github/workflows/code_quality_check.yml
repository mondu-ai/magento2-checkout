name: Code Quality Check

on:
  pull_request:
    branches:
      - main

jobs:
  code_quality_phpcs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # The Magento coding standard is public on Packagist, so no repo.magento.com credentials are needed.
      # PHP and Composer come with the runner image.
      - name: Install Magento coding standard
        run: composer create-project --no-interaction --no-progress magento/magento-coding-standard:41 "$RUNNER_TEMP/magento-coding-standard"

      - name: Run PHP CodeSniffer
        run: '"$RUNNER_TEMP/magento-coding-standard/vendor/bin/phpcs" --standard=PSR12,Magento2 .'
